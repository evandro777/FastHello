name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      # Checks Cargo.lock against the RustSec advisory database. A new advisory can fail an unrelated PR.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

      - name: Validate packaging metadata
        run: |
          appstreamcli validate --no-net packaging/io.github.OWNER.MyApp.metainfo.xml
          desktop-file-validate packaging/io.github.OWNER.MyApp.desktop

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev

      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.120

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --locked

  rename:
    name: Template rename still works
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rename in a scratch copy and build it
        run: |
          cp -r . "$RUNNER_TEMP/copy"
          cd "$RUNNER_TEMP/copy"
          ./rename.sh testapp TestApp someone
          rm rename.sh
          python3 dev/gen_po.py
          cargo check --locked
          appstreamcli validate --no-net packaging/io.github.someone.TestApp.metainfo.xml
          desktop-file-validate packaging/io.github.someone.TestApp.desktop
